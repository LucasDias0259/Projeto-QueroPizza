<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer pedido - QueroPizza</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/reset.css">
</head>
<body>

<header>
    <div class="logo">QueroPizza</div>
    <nav>
        <a href="index.html">Voltar ao cardápio</a>
    </nav>
</header>

<main>
    <section class="secao pedido">
        <h2>Faça seu pedido</h2>
        <p class="subtitulo">Preencha seus dados para finalizar</p>

        <form id="pedidoForm">
            <label for="nome">Seu nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome" required>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" required>

            <label for="pizzaEscolhida">Escolha a pizza</label>
            <select id="pizzaEscolhida" required>
                <option value="">Selecione uma pizza</option>
                <option value="Margherita - R$ 39,90">Margherita - R$ 39,90</option>
                <option value="Calabresa - R$ 42,90">Calabresa - R$ 42,90</option>
                <option value="Frango com Catupiry - R$ 44,90">Frango com Catupiry - R$ 44,90</option>
                <option value="Quatro Queijos - R$ 46,90">Quatro Queijos - R$ 46,90</option>
            </select>

            <label for="quantidade">Quantidade</label>
            <input type="number" id="quantidade" min="1" max="20" value="1" required>

            <label for="endereco">Endereço de entrega</label>
            <textarea id="endereco" rows="3" placeholder="Rua, número, bairro..." required></textarea>

            <label for="observacao">Observação</label>
            <textarea id="observacao" rows="3" placeholder="Ex.: sem cebola"></textarea>

            <button type="submit" class="botao enviar">Enviar pedido</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </section>
</main>

<footer>
    <p>QueroPizza Rua xxxxxxx-xxx</p>
</footer>

<script>
    // Preenche a pizza escolhida no cardápio, se a página foi aberta por um botão
    const params = new URLSearchParams(window.location.search);
    const pizzaDaUrl = params.get("pizza");
    if (pizzaDaUrl) {
        document.getElementById("pizzaEscolhida").value = pizzaDaUrl;
    }

    // Mostra a confirmação ao enviar o formulário
    document.getElementById("pedidoForm").addEventListener("submit", function (evento) {
        evento.preventDefault();

        const nome = document.getElementById("nome").value;
        const pizza = document.getElementById("pizzaEscolhida").value;
        const quantidade = document.getElementById("quantidade").value;
        const endereco = document.getElementById("endereco").value;

        document.getElementById("resultado").textContent =
            "Obrigado, " + nome + "! Seu pedido de " + quantidade + " x " + pizza +
            " foi recebido. Entregaremos em: " + endereco;

        this.reset();
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale com o autor - QueroPizza</title>
    <link rel="stylesheet" href="css/contato.css">
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">QueroPizza</div>
    <nav>
        <a href="index.html">Início</a>
        <a href="">Cardápio</a>
        <a href="pedido.html">Fazer pedido</a>
        <a href="contato.html">Contato</a>
    </nav>
</header>

<main>
    <section class="secao contato">
        <h2>Fale Com O Nosso Suporte Aqui Ou Enviei Uma Duvida Ou Sugestão</h2>
        <p class="subtitulo">Envie sua dúvida, sugestão ou elogio</p>

        <form id="contatoForm">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>

            <label for="assunto">Assunto</label>
            <select id="assunto" name="assunto" required>
                <option value="">Selecione um assunto</option>
                <option value="duvida">Dúvida</option>
                <option value="sugestao">Sugestão</option>
                <option value="elogio">Elogio</option>
                <option value="outro">Outro</option>
            </select>

            <label for="mensagem">Mensagem</label>
            <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem" required></textarea>

            <button type="submit" class="botao enviar">Enviar mensagem</button>
        </form>

        <div id="resultado" class="resultado"></div>
    </section>
</main>

<footer>
    <p>QueroPizza Rua xxxxxxx-xxx</p>
</footer>

<script>
    document.getElementById("contatoForm").addEventListener("submit", function (evento) {
        evento.preventDefault();

        const nome = document.getElementById("nome").value;
        const assunto = document.getElementById("assunto").value;

        document.getElementById("resultado").textContent =
            "Obrigado, " + nome + "! Sua mensagem sobre \"" + assunto + "\" foi recebida.";

        this.reset();
    });
</script>

</body>
</html>
